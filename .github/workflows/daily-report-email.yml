name: Daily sales report email

# Requested 2026-09-03 — auditor gets the day's item-by-item sales report
# (scripts/send-daily-report-email.mjs, same numbers reports-app shows) by
# email every night at 11:59 PM IST. GitHub Actions' scheduler is free and
# doesn't touch the Firebase project's billing plan at all — this workflow
# only reads Firestore (Admin SDK, via a service account secret below) and
# sends one Gmail SMTP email.
#
# Cron is always UTC. 23:59 IST = 18:29 UTC (IST is UTC+5:30) — every day,
# not just business days, since the cafe has no closed days on record.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT — full service-account JSON as one secret
#     (Firebase Console > Project settings > Service accounts > Generate
#     new private key). Paste the whole file's contents as the secret value.
#   GMAIL_USER          — the sending Gmail address
#   GMAIL_APP_PASSWORD  — that account's 16-character app password
#     (myaccount.google.com > Security > 2-Step Verification > App passwords)
#   AUDITOR_EMAIL        — recipient address(es), comma-separated for more than one
on:
  schedule:
    - cron: "29 18 * * *"
  # Manual "Run workflow" button in the Actions tab — for testing without
  # waiting for 11:59 PM, or resending a day's report on request. Leave
  # report_date blank for "today"; fill it in (YYYY-MM-DD) to (re)send a
  # specific past day — added 2026-09-04 after the very first scheduled
  # run failed (Firestore quota) and that day's report had no way to be
  # recovered once "today" moved on.
  workflow_dispatch:
    inputs:
      report_date:
        description: "Business day to send (YYYY-MM-DD) — leave blank for today"
        required: false
        type: string

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Full repo install (root deps + every workspace) via the committed
      # lockfile — the same firebase-admin/nodemailer/xlsx this script needs
      # are plain root devDependencies (package.json), so nothing beyond a
      # normal `npm ci` is required to have them on PATH for the next step.
      - run: npm ci
      - run: node scripts/send-daily-report-email.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AUDITOR_EMAIL: ${{ secrets.AUDITOR_EMAIL }}
          REPORT_DATE: ${{ inputs.report_date }}
